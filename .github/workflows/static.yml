# .github/workflows/static.yml
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ▼ Node.js のセットアップを追加
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ▼ 静的ファイル限定の catalog.json を自動生成
      # （CatalogService.js は Node.js 標準モジュールのみ使用しているため npm install 不要）
      - name: Build static catalog.json
        working-directory: ViewerServer
        run: npm run build:catalog

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
