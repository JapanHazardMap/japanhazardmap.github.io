<!-- public/index.html -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Hazard Map Viewer</title>
    <link rel="stylesheet" href="./viewer/vendor/maplibre-gl.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
        overflow: hidden;
      }

      /* トップメニューバー（上下スライド格納対応） */
      #topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        padding: 8px 12px;
        background: #1e293b;
        color: #f8fafc;
        z-index: 20;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        max-height: 260px;
        overflow: hidden;
        transition:
          max-height 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          padding 0.28s ease,
          opacity 0.22s ease;
      }
      #topbar.collapsed {
        max-height: 0;
        padding-top: 0;
        padding-bottom: 0;
        opacity: 0;
        pointer-events: none;
      }

      #topbar h1 {
        font-size: 15px;
        margin: 0 6px 0 0;
        white-space: nowrap;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .control-group label {
        font-size: 12px;
        color: #cbd5e1;
        white-space: nowrap;
      }
      select,
      button {
        font-size: 13px;
        padding: 5px 10px;
        border-radius: 4px;
        border: 1px solid #475569;
      }
      select {
        background: #ffffff;
        color: #0f172a;
        min-width: 135px;
      }
      button#btn-nearby {
        background: #0284c7;
        color: #ffffff;
        border-color: #0369a1;
        cursor: pointer;
        font-weight: bold;
      }
      button#btn-nearby:hover {
        background: #0369a1;
      }
      button#btn-nearby:disabled {
        background: #64748b;
        cursor: wait;
      }

      .topbar-right {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .topbar-right a {
        color: #93c5fd;
        font-size: 12px;
        text-decoration: none;
        white-space: nowrap;
      }
      .topbar-right a:hover {
        text-decoration: underline;
      }

      #btn-topbar-close {
        background: #334155;
        color: #f1f5f9;
        border: 1px solid #64748b;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btn-topbar-close:hover {
        background: #475569;
      }

      /* メインエリア */
      #main {
        position: relative;
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      #map {
        flex: 1;
        height: 100%;
        width: 100%;
      }

      /* トップバー格納時に右上に表示される再表示ボタン */
      #btn-topbar-open {
        position: absolute;
        top: 12px;
        right: 54px; /* 右上のズーム・ベースマップUIと重ならない位置 */
        z-index: 15;
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid #475569;
        border-radius: 6px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        cursor: pointer;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      #btn-topbar-open.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateY(-16px);
      }

      /* 左レイヤーパネル格納時に表示される引き出しボタン */
      #btn-drawer-open {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 9;
        background: #ffffff;
        color: #0f172a;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      #btn-drawer-open.hidden {
        opacity: 0;
        pointer-events: none;
        transform: translateX(-16px);
      }

      /* 選択された自治体のデータ切替パネル（左スライド格納対応） */
      #layer-drawer {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 310px;
        max-width: calc(100vw - 24px);
        max-height: calc(100% - 24px);
        background: rgba(255, 255, 255, 0.96);
        border-radius: 8px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
        padding: 12px;
        overflow-y: auto;
        z-index: 10;
        transition:
          transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
          opacity 0.22s ease;
      }
      #layer-drawer.collapsed {
        transform: translateX(calc(-100% - 24px));
        opacity: 0;
        pointer-events: none;
      }

      .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid #e2e8f0;
        padding-bottom: 6px;
        margin-bottom: 6px;
      }
      #drawer-title {
        font-size: 14px;
        margin: 0;
        color: #0f172a;
        flex: 1;
      }
      #btn-drawer-close {
        background: #f1f5f9;
        color: #334155;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        padding: 3px 8px;
        font-size: 12px;
        cursor: pointer;
        white-space: nowrap;
      }
      #btn-drawer-close:hover {
        background: #e2e8f0;
      }

      #status-text {
        font-size: 12px;
        color: #475569;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .dataset-group {
        margin-bottom: 10px;
      }
      .dataset-group-title {
        font-size: 12px;
        font-weight: bold;
        color: #334155;
        margin-bottom: 4px;
        background: #f1f5f9;
        padding: 3px 6px;
        border-radius: 3px;
      }
      .layer-item {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 12px;
        margin: 5px 0;
        cursor: pointer;
        word-break: break-all;
      }
      .layer-item input[type='checkbox'] {
        margin-top: 2px;
        flex-shrink: 0;
      }

      @media (max-width: 600px) {
        #layer-drawer {
          max-height: 45vh;
          max-height: 45dvh;
        }
        #btn-topbar-open {
          top: 56px;
          left: 12px;
          right: auto;
        }
      }

      /* ポップアップテーブル */
      .popup-table {
        border-collapse: collapse;
        font-size: 12px;
        max-width: 340px;
      }
      .popup-table th,
      .popup-table td {
        border: 1px solid #ccc;
        padding: 4px 6px;
        text-align: left;
        vertical-align: top;
      }
      .popup-table th {
        background: #f3f4f6;
        white-space: nowrap;
      }
      .popup-layer-title {
        font-weight: bold;
        font-size: 13px;
        margin: 6px 0 4px;
        color: #1f2937;
      }
    </style>
  </head>
  <body>
    <header id="topbar">
      <h1>Japan Hazard Map</h1>

      <div class="control-group">
        <label for="pref-select">都道府県</label>
        <select id="pref-select">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="control-group">
        <label for="muni-select">市区町村</label>
        <select id="muni-select" disabled>
          <option value="">先に都道府県を選択</option>
        </select>
      </div>

      <button id="btn-nearby" type="button">📍 現在地周辺（半径500m）を表示</button>

      <div class="topbar-right">
        <a href="./layers/">全レイヤー一覧 (/layers)</a>
        <button id="btn-topbar-close" type="button" title="上部メニューを隠す">
          ▲ メニューを隠す
        </button>
      </div>
    </header>

    <div id="main">
      <!-- トップメニュー格納時に表示される再表示ボタン -->
      <button id="btn-topbar-open" class="hidden" type="button" aria-label="検索メニューを開く">
        ▼ 地域選択メニュー
      </button>

      <!-- 左パネル格納時に表示される引き出しボタン -->
      <button id="btn-drawer-open" class="hidden" type="button" aria-label="レイヤー一覧を開く">
        ☰ レイヤー切替
      </button>

      <!-- スライド格納可能なレイヤーパネル -->
      <aside id="layer-drawer">
        <div class="drawer-header">
          <h2 id="drawer-title">表示エリアを選択</h2>
          <button id="btn-drawer-close" type="button" title="パネルを隠す">◀ 隠す</button>
        </div>
        <div id="status-text">
          上のメニューから都道府県・市区町村を選ぶか、「現在地周辺（半径500m）」を押してください。
        </div>
        <div id="active-layers"></div>
      </aside>

      <div id="map"></div>
    </div>

    <script src="./viewer/vendor/pmtiles.js"></script>
    <script type="module" src="./viewer/citizen-app.js"></script>
  </body>
</html>
