<!-- public/index.html -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Hazard Map Viewer</title>
    <link rel="stylesheet" href="./viewer/vendor/maplibre-gl.css" />
    <link rel="stylesheet" href="./viewer/citizen.css" />
    <link rel="icon" href="./favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="./app-icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./app-icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./app-icons/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="msapplication-config" content="./browserconfig.xml" />
    <meta property="og:image" content="https://japanhazardmap.github.io/app-icons/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
  </head>
  <body>
    <header id="topbar">
      <h1>Japan Hazard Map</h1>
      <div class="control-group">
        <label for="pref-select">都道府県</label>
        <select id="pref-select">
          <option value="">選択してください</option>
        </select>
      </div>

      <div class="control-group">
        <label for="muni-select">市区町村</label>
        <select id="muni-select" disabled>
          <option value="">先に都道府県を選択</option>
        </select>
      </div>

      <button id="btn-nearby" type="button">現在地周辺（半径500m）を表示</button>

      <div class="topbar-right">
        <a href="./layers/">全レイヤー一覧 (/layers)</a>
        <button id="btn-topbar-close" type="button" title="上部メニューを隠す">
          ▲ メニューを隠す
        </button>
      </div>
    </header>

    <div id="main">
      <button id="btn-topbar-open" class="hidden" type="button" aria-label="検索メニューを開く">
        ▼ 地域選択メニュー
      </button>

      <button id="btn-drawer-open" class="hidden" type="button" aria-label="レイヤー一覧を開く">
        ? レイヤー切替
      </button>

      <aside id="layer-drawer">
        <div class="drawer-header">
          <h2 id="drawer-title">表示エリアを選択</h2>
          <button id="btn-drawer-close" type="button" title="パネルを隠す">? 隠す</button>
        </div>
        <div id="status-text">
          上のメニューから都道府県・市区町村を選ぶか、「現在地周辺（半径500m）」を押してください。
        </div>
        <div id="active-layers"></div>
      </aside>

      <div id="map"></div>
    </div>

    <script src="./viewer/vendor/pmtiles.js"></script>
    <script type="module" src="./viewer/citizen-app.js"></script>
  </body>
</html>
