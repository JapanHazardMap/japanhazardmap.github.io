<!-- public/layers/index.html -->
<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Hazard Map Viewer - All Layers</title>
    <link rel="stylesheet" href="../viewer/vendor/maplibre-gl.css" />
    <style>
      body {
        margin: 0;
        display: flex;
        height: 100vh;
        font-family: sans-serif;
      }
      #sidebar {
        width: 340px;
        border-right: 1px solid #ccc;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
        background: #ffffff;
      }
      #map {
        flex: 1;
      }
      #viewerStatus {
        font-size: 12px;
        color: #475569;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .layer-item {
        margin-bottom: 6px;
        font-size: 13px;
      }
      .popup-table {
        border-collapse: collapse;
        font-size: 12px;
        max-width: 340px;
      }
      .popup-table th,
      .popup-table td {
        border: 1px solid #ccc;
        padding: 4px 6px;
        text-align: left;
        vertical-align: top;
      }
      .popup-table th {
        background: #f3f4f6;
        white-space: nowrap;
      }
      .popup-layer-title {
        font-weight: bold;
        font-size: 13px;
        margin: 6px 0 4px;
        color: #1f2937;
      }
    </style>
    <link rel="icon" href="../favicon.ico" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="../app-icons/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="../app-icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="../app-icons/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../app-icons/apple-touch-icon-180x180.png" />
    <link rel="manifest" href="../app-icons/site.webmanifest" />
  </head>
  <body>
    <div id="sidebar">
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 8px;
          border-bottom: 1px solid #e2e8f0;
          padding-bottom: 6px;
        "
      >
        <h3 style="margin: 0">All Layers</h3>
        <a href="../" style="font-size: 12px; color: #2563eb; text-decoration: none"
          >← 市区町村ビューアへ</a
        >
      </div>
      <div id="viewerStatus">全レイヤー一覧を読み込み中...</div>
      <div id="layerTree"></div>
      <div id="layers"></div>
    </div>
    <div id="map"></div>

    <script src="../viewer/vendor/pmtiles.js"></script>
    <script type="module" src="../viewer/app.js"></script>
  </body>
</html>
